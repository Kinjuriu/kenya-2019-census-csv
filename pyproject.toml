[project]
name = "kenya-census-2019"
version = "0.1.0"
description = "Kenya 2019 Population and Housing Census (KNBS) tables extracted from the official PDFs to CSV."
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kenya_census"]

[tool.pytest.ini_options]
pythonpath = ["src"]
